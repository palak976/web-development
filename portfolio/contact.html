                    </p>

                    <p>
                        <label for="message">Message:</label><br>
                        <textarea id="message" name="message" rows="6" cols="40"
                                  required></textarea>
                    </p>

                    <p>
                        <input type="submit" value="Submit">
                        <input type="reset" value="Reset">
                    </p>

                </fieldset>

            </form>
        </section>
